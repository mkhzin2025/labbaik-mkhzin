services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-https://labbaik.mkhzin-store.com}
        VITE_WEBHOOK_BASE_URL: ${PUBLIC_WEBHOOK_URL:-${PUBLIC_API_URL:-https://labbaik.mkhzin-store.com}}
    container_name: labbaik-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: labbaik-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      TYPEORM_SYNCHRONIZE: ${TYPEORM_SYNCHRONIZE:-true}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-labbaik_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labbaik_postgres_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-labbaik_db}
      MONGO_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-labbaik_mongo_admin}:${MONGO_INITDB_ROOT_PASSWORD:-labbaik_mongo_change_me}@mongodb:27017/${MONGO_DATABASE:-labbaik_chats}?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-labbaik_jwt_change_me_before_production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1d}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-labbaik_whatsapp_verify_change_me}
      META_APP_SECRET: ${META_APP_SECRET:-labbaik_meta_app_secret_change_me}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-labbaik_credential_encryption_change_me}
      UPLOADS_DIR: /app/uploads
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      APP_DOMAIN: ${APP_DOMAIN:-labbaik.mkhzin-store.com}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://${APP_DOMAIN:-labbaik.mkhzin-store.com}}
      PUBLIC_WEBHOOK_URL: ${PUBLIC_WEBHOOK_URL:-https://${APP_DOMAIN:-labbaik.mkhzin-store.com}}
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads

  adminer:
    image: adminer:4
    container_name: labbaik-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

  postgres:
    image: postgres:15-alpine
    container_name: labbaik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-labbaik_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labbaik_postgres_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-labbaik_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20

  mongodb:
    image: mongo:6.0
    container_name: labbaik-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-labbaik_mongo_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-labbaik_mongo_change_me}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\""]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: labbaik-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  backend_uploads:
