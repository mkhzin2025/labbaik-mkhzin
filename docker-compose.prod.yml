x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  traefik:
    image: traefik:v3.2
    container_name: labbaik-traefik
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env.production
    environment:
      - DOCKER_API_VERSION=1.44
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${PUBLIC_API_URL}
        VITE_WEBHOOK_BASE_URL: ${PUBLIC_WEBHOOK_URL:-${PUBLIC_API_URL}}
    container_name: labbaik-frontend
    restart: unless-stopped
    logging: *default-logging
    labels:
      - traefik.enable=true
      - traefik.http.routers.labbaik-frontend.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.labbaik-frontend.entrypoints=websecure
      - traefik.http.routers.labbaik-frontend.tls.certresolver=letsencrypt
      - traefik.http.services.labbaik-frontend.loadbalancer.server.port=80
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: labbaik-backend
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env.production
    labels:
      - traefik.enable=true
      - traefik.http.routers.labbaik-backend.rule=Host(`${APP_DOMAIN}`) && (PathPrefix(`/auth`) || PathPrefix(`/users`) || PathPrefix(`/organizations`) || PathPrefix(`/stores`) || PathPrefix(`/integrations`) || PathPrefix(`/billing`) || PathPrefix(`/channels`) || PathPrefix(`/customers`) || PathPrefix(`/reviews`) || PathPrefix(`/notifications`) || PathPrefix(`/flows`) || PathPrefix(`/conversations`) || PathPrefix(`/webhooks`) || PathPrefix(`/api-docs`) || Path(`/api-docs-json`) || PathPrefix(`/socket.io`))
      - traefik.http.routers.labbaik-backend.entrypoints=websecure
      - traefik.http.routers.labbaik-backend.tls.certresolver=letsencrypt
      - traefik.http.routers.labbaik-backend.priority=100
      - traefik.http.services.labbaik-backend.loadbalancer.server.port=3000
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=${BACKEND_HEAP_MB:-1024}
      PORT: 3000
      TYPEORM_SYNCHRONIZE: ${TYPEORM_SYNCHRONIZE:-true}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MONGO_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/${MONGO_DATABASE}?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      META_APP_SECRET: ${META_APP_SECRET}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
      UPLOADS_DIR: /app/uploads
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  adminer:
    image: adminer:4
    container_name: labbaik-adminer
    restart: unless-stopped
    logging: *default-logging
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

  postgres:
    image: postgres:15-alpine
    container_name: labbaik-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20

  mongodb:
    image: mongo:6.0
    # Mongo takes ~50% of host RAM for its cache by default, starving the backend and Postgres.
    command: ["mongod", "--wiredTigerCacheSizeGB", "${MONGO_CACHE_GB:-1}"]
    container_name: labbaik-mongodb
    restart: unless-stopped
    logging: *default-logging
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    # mongosh is a full Node process; a tight interval piles them up when Mongo is slow.
    # ping needs no auth, so skip the login round-trip too.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--norc", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 20s
      start_period: 30s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: labbaik-redis
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "${REDIS_MAXMEMORY:-128mb}", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  traefik_letsencrypt:
  backend_uploads:
