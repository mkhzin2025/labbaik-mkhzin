services:
  backend:
    build:
      context: ./backend
    container_name: labbaik-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: labbaik_db
      MONGO_URL: mongodb://admin:password123@mongodb:27017/labbaik_chats?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-LABBAIK_SECRET_2026}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1d}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-labbaik_whatsapp_verify}
      META_APP_SECRET: ${META_APP_SECRET:-labbaik_meta_app_secret_change_me}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-labbaik_dev_credential_encryption_change_me}
      UPLOADS_DIR: /app/uploads
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: labbaik-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: same-origin
      VITE_WEBHOOK_BASE_URL: ${VITE_WEBHOOK_BASE_URL:-same-origin}
      VITE_DEV_PROXY_TARGET: http://backend:3000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  ngrok:
    image: ngrok/ngrok:3
    container_name: labbaik-ngrok
    restart: unless-stopped
    command: ["http", "frontend:5173", "--log=stdout"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - frontend
    profiles:
      - share

  adminer:
    image: adminer:4
    container_name: labbaik-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: labbaik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: labbaik_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d labbaik_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongodb:
    image: mongo:6.0
    container_name: labbaik-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username admin --password password123 --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\""]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: labbaik-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  mongo_data:
  frontend_node_modules:
  backend_uploads:
